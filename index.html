    <script>
      (function () {
        // Suppress dev-server WebSocket disconnection in iframe/cloud sandbox where HMR is disabled
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function (url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))
            ) {
              var fake = new EventTarget();
              fake.OPEN = 1;
              fake.CONNECTING = 0;
              fake.CLOSING = 2;
              fake.CLOSED = 3;
              fake.readyState = 1;
              fake.send = function () {};
              fake.close = function () {};
              fake.addEventListener = fake.addEventListener.bind(fake);
              fake.removeEventListener = fake.removeEventListener.bind(fake);
              fake.dispatchEvent = fake.dispatchEvent.bind(fake);
              return fake;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function (a) { return (a && a.message) || a; }).join(' ');
          if (str.indexOf('failed to connect to websocket') !== -1 || str.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function (event) {
          var msg = (event && event.reason && (event.reason.message || event.reason)) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (event) {
          var msg = (event && event.message) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
